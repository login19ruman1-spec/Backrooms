# Имя уже созданного плоского мира. Укажи точное имя из папки сервера.
world-name: "flat"

# Координаты центра, где начинается Уровень 0.
origin-x: 0
origin-z: 0

# Расстояние между зонами уровней и подуровней (0, 0.1, 1, 1.1 ... 5.1).
level-spacing: 4096

# Высота пола и потолка генератора.
floor-y: 60
ceiling-y: 68

# После включения генератор строит комнаты в чанках по мере их загрузки.
generation-enabled: false

# NPC-клоны игроков. Для настоящих player-NPC и копирования скинов требуется Citizens.
clones:
  enabled: true
  # Создавать клон каждого игрока, который заходил на сервер, и запоминать ник в plugins/Backrooms/players.yml.
  auto-track-players: true
  # Имена, которые появятся даже если эти игроки ещё не заходили после установки плагина.
  names:
    - "7gh"
    - "Alon"
    - "Voredishn"
  # Максимум NPC-клонов, чтобы не перегружать сервер.
  max-npcs: 16
  # Случайное размещение в чанках вокруг начала мира Backrooms.
  spawn-radius-chunks: 12

  # Атмосферное поведение: NPC ходят, пристально смотрят на игрока и иногда исчезают.
  haunting-behavior: true
  # Дистанция, на которой клон может заметить игрока.
  notice-distance: 18
  # После исчезновения клон возвращается через случайное время.
  vanish-min-seconds: 12
  vanish-max-seconds: 42
